<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>limina</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">limina</div>
    <div class="conn">
      <label>server <input id="url" type="text" value="ws://localhost:8787/" size="22" /></label>
      <label>token <input id="auth-token" type="password" value="" size="18" autocomplete="off" /></label>
      <label>as
        <select id="profile">
          <option value="reviewer" selected>reviewer</option>
          <option value="system.readonly">system.readonly</option>
          <option value="reviewer.coordinator">reviewer.coordinator</option>
          <option value="builder.review">builder.review</option>
        </select>
      </label>
      <label>poll ms <input id="interval" type="number" value="1000" min="250" step="250" size="5" /></label>
      <button id="connect" class="btn">Connect</button>
      <button id="disconnect" class="btn btn-ghost">Disconnect</button>
      <span class="status"><span id="status-dot" class="dot dot-off"></span><span id="status-text">disconnected</span></span>
      <button id="settings-toggle" class="btn btn-ghost settings-toggle" title="Settings" aria-label="Settings">⚙</button>
      <div class="settings-popover panel" id="settings-popover" hidden>
        <div class="settings-row">
          <label class="settings-label" for="settings-model">Model</label>
          <select id="settings-model" class="settings-input"></select>
        </div>
        <div class="settings-row">
          <label class="settings-label" for="settings-cues">Builder cues</label>
          <input id="settings-cues" class="settings-check" type="checkbox" />
        </div>
        <div class="settings-row">
          <label class="settings-label" for="settings-default-url">Server</label>
          <input id="settings-default-url" class="settings-input" type="text" />
        </div>
        <div class="settings-row">
          <label class="settings-label" for="settings-default-interval">Poll ms</label>
          <input id="settings-default-interval" class="settings-input" type="number" min="250" step="250" />
        </div>
      </div>
    </div>
  </header>

  <!-- STAGE: the viewport IS the app (full canvas). Tools are independent floating windows, each
       opened from the ☰ menu, draggable by its title bar and closable — not one crammed sidebar. -->
  <main class="stage">
    <section class="panel viewport" id="viewport">
      <div class="panel-head">
        <h3>Live viewport</h3>
        <span class="hint"><span id="viewport-status">idle</span></span>
      </div>
      <div class="panel-body" id="viewport-body">
        <canvas id="editor-viewport" width="640" height="360"></canvas>
      </div>
      <div class="viewport-tools" aria-label="Viewport controls">
        <button id="viewport-snap-toggle" class="viewport-tool" type="button" aria-pressed="false" title="Toggle snapping (S)">Snap off</button>
        <label class="viewport-tool-field" title="Translate snap increment">
          T <input id="viewport-snap-translate" type="number" value="0.5" min="0.001" step="0.1" />
        </label>
        <label class="viewport-tool-field" title="Rotate snap degrees">
          R <input id="viewport-snap-rotate" type="number" value="15" min="0.001" step="1" />
        </label>
        <label class="viewport-tool-field" title="Scale snap increment">
          S <input id="viewport-snap-scale" type="number" value="0.1" min="0.001" step="0.1" />
        </label>
        <button id="viewport-space-toggle" class="viewport-tool" type="button" aria-pressed="false" title="Toggle local/global gizmo space (X)">Global</button>
        <button id="viewport-grid-toggle" class="viewport-tool" type="button" aria-pressed="true" title="Toggle ground grid (G)">Grid on</button>
        <button id="viewport-wireframe-toggle" class="viewport-tool" type="button" aria-pressed="false" title="Toggle wireframe view (F)">Wire off</button>
      </div>
    </section>

    <button class="tools-toggle" id="tools-toggle" title="Tools" aria-label="Tools menu">☰</button>
    <nav class="tools-menu" id="tools-menu" hidden>
      <button data-target="world">World</button>
      <button data-target="roster">Team</button>
      <button data-target="reasoning">Reasoning</button>
      <button data-target="history">History</button>
      <button data-target="approval">Approval</button>
      <button data-target="chat">Chat</button>
    </nav>

    <section class="panel window" id="world" hidden>
      <div class="panel-head" data-drag><h3>World</h3><span class="panel-spin" id="world-spin" hidden></span><button class="win-close" data-close="world" aria-label="Close">×</button></div>
      <div class="panel-body" id="world-body"><div class="muted">connect to begin</div></div>
    </section>

    <section class="panel window" id="roster" hidden>
      <div class="panel-head" data-drag><h3>Team</h3><span class="panel-spin" id="roster-spin" hidden></span><button class="win-close" data-close="roster" aria-label="Close">×</button></div>
      <div class="panel-body" id="roster-body"><div class="muted">connect to begin</div></div>
    </section>

    <section class="panel window" id="inspector" hidden>
      <div class="panel-head" data-drag><h3>Inspector</h3><button class="win-close" data-close="inspector">×</button></div>
      <div class="panel-body" id="inspector-body"><div class="muted">select an entity in World</div></div>
    </section>

    <section class="panel window" id="reasoning" hidden>
      <div class="panel-head" data-drag><h3>Reasoning</h3><span class="panel-spin" id="reasoning-spin" hidden></span><button class="win-close" data-close="reasoning" aria-label="Close">×</button></div>
      <div class="panel-body" id="reason-body"><div class="muted">connect to begin</div></div>
    </section>

    <section class="panel window" id="history" hidden>
      <div class="panel-head" data-drag><h3>History</h3><button class="win-close" data-close="history" aria-label="Close">×</button></div>
      <div class="panel-body" id="history-body"><div class="muted">connect to begin</div></div>
    </section>

    <section class="panel window" id="approval" hidden>
      <div class="panel-head" data-drag><h3>Approval <span id="approval-count" class="count">0</span></h3><span class="panel-spin" id="approval-spin" hidden></span><button id="propose" class="btn btn-small" title="Propose a held edit">+ test</button><button id="propose-move" class="btn btn-small" title="Agent moves an existing entity">+ move</button><button class="win-close" data-close="approval" aria-label="Close">×</button></div>
      <div class="panel-body" id="approval-body"><div class="muted">connect to begin</div></div>
    </section>

    <section class="panel window chat-window" id="chat" hidden>
      <div class="panel-head" data-drag><h3>Chat</h3><button class="win-close" data-close="chat" aria-label="Close">×</button></div>
      <div class="panel-body chat-body" id="chat-body"></div>
    </section>
  </main>

  <footer class="logbar" data-console-expanded="false" data-console-active-tab="console">
    <button class="log-strip" id="console-expand" type="button" aria-expanded="false" aria-controls="console-panel">
      <span class="log-strip-title">Console</span>
      <span class="log-strip-preview" id="console-preview" aria-live="polite"></span>
      <span class="log-strip-chevron" aria-hidden="true">⌃</span>
    </button>
    <div class="console-panel" id="console-panel" aria-label="Console panel">
      <div class="log-head">
        <div class="console-tabs" role="tablist" aria-label="Console views">
          <button class="console-tab active" id="console-tab-console" type="button" role="tab" aria-selected="true" aria-controls="console-pane-console" data-console-tab="console">Console</button>
          <button class="console-tab" id="console-tab-trace" type="button" role="tab" aria-selected="false" aria-controls="console-pane-trace" data-console-tab="trace">Trace</button>
        </div>
        <button class="console-collapse" id="console-collapse" type="button" aria-label="Collapse console">⌄</button>
      </div>
      <div class="console-body">
        <div class="console-pane active" id="console-pane-console" role="tabpanel" aria-labelledby="console-tab-console" data-console-pane="console">
          <div id="log" class="log"></div>
        </div>
        <div class="console-pane" id="console-pane-trace" role="tabpanel" aria-labelledby="console-tab-trace" data-console-pane="trace" hidden>
          <div id="console-trace" class="console-trace"></div>
        </div>
      </div>
    </div>
  </footer>

  <script type="module" src="src/windows.js"></script>
  <script type="module" src="src/take-control.js"></script>
  <script type="module" src="src/app.js"></script>
  <script type="module" src="src/viewport.js"></script>
  <script type="module" src="src/chat.js"></script>
  <script type="module" src="src/console.js"></script>
  <script type="module" src="src/toasts.js"></script>
</body>
</html>
