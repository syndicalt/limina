const PRESET = { spruce: "Pine Large", pine: "Pine Medium", birch: "Aspen Medium" };
function makeBase(species, s) {
  const t = new Tree();
  t.loadPreset(PRESET[species]);   // copies tuned options + generates once

// Build all trees; NORMALIZE each to a realistic height (meters) baked into geometry so a scattered
// instance is a real tree (~15 m), not a 40-unit giant as tall as a mountain. Base stays at y=0.
const TARGET_H = { spruce: 16, pine: 15, birch: 11 };
const trees = SPEC.map(([sp, sd]) => {
